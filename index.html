<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserManagementDashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="styles.css"/>
  
</head>
<body>
   
    <nav class="navbar navbar-expand-lg bg-body-tertiary" style="background-color: rgba(136, 139, 143, 0.3) !important;">

  <div class="container-fluid ">
    <a class="navbar-brand " href="#">User Management Dashboard</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon ms-auto"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item ">
          <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#">Users</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="#">Settings</a>
        </li>
       
      </ul>
    </div>
  </div>
</nav>
    
<div class="container-fluid">
    <div class="row pt-1">
        <div class="col-2"> 
          <ul class="list-unstyled">
    <li><a href="#" class="text-white text-decoration-none d-block py-2 px-3 active"><b>Dashboard</b></a></li>
    <li><a href="#" class="text-white text-decoration-none d-block py-2 px-3"><b>Users</b></a></li>
    <li><a href="#" class="text-white text-decoration-none d-block py-2 px-3"><b>Settings</b></a></li>
  </ul>  

        </div>
         <div class="col-10 pt-5  text-center" >
            <button type="button" class="btn btn-primary mb-3 " data-bs-toggle="modal" data-bs-target="#addUserModal">Add User</button>
            
            
  <table class="table mt-3 mx-auto" style="border: 1px solid black;">
  <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col">Email</th>
      <th scope="col">Role</th>
      <th scope="col">Actions</th>
    </tr>
  </thead>
  <tbody>
  </tbody>
</table>


    </div>
    <footer class="py-3 my-1 border-top">
  <p class="text-center text-muted mb-0">
  <b> © 2026 Ayesha | User Management Dashboard</b> 
  </p>
</footer>


    <div class="modal "  id="addUserModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
            <div class="mb-3">  
            <label for="name" class="form-label">Name</label>
            <input type="text"  id="name" name="name" placeholder="Enter your name" class="form-control">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" placeholder="xyz@gmail.com"class="form-control">
            </div>

            <div class="mb-3">
                <label for="role" class="form-label">Role</label>
                <input type="text" id="role" name="role" placeholder="Enter Your role "class="form-control">
            </div>
            

          


        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Add User</button>
      </div>
    </div>
  </div>
</div>

    </div>

</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
